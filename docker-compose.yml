services:
  mysql:
    image: mysql:8.4
    container_name: ums-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ums}
      MYSQL_USER: ${MYSQL_USER:-ums}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ums_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [ums-net]

  backend:
    build: ./backend
    container_name: ums-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ums}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-ums}
      DB_PASSWORD: ${MYSQL_PASSWORD:-ums_password}
      JWT_SECRET: ${JWT_SECRET:-change-me-please-this-is-only-a-development-secret-key}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-28800000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
      SIGNUP_REQUIRE_APPROVAL: ${SIGNUP_REQUIRE_APPROVAL:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks: [ums-net]

  frontend:
    build: ./frontend
    container_name: ums-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks: [ums-net]

volumes:
  mysql_data:

networks:
  ums-net:
