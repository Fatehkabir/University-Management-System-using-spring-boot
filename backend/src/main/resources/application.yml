server:
  port: 8080

spring:
  application:
    name: university-management-system
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ums?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:ums}
    password: ${DB_PASSWORD:ums_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-this-is-only-a-development-secret-key}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}   # 8 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  signup:
    enabled: ${SIGNUP_ENABLED:true}
    require-approval: ${SIGNUP_REQUIRE_APPROVAL:false}
  seed:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:admin123}
    admin-email: ${ADMIN_EMAIL:admin@university.local}
    demo-data: ${SEED_DEMO_DATA:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    edu.kuet.ums: INFO
